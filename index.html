<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c7b">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Planejamento Financeiro Completo</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg: #eef2f5;
  --card: #ffffff;
  --ink: #14202b;
  --mut: #5b6b79;
  --line: #d7dfe6;
  --c: #0e7c7b;
  --v: #3a5bd9;
  --ok: #1d7a3e;
  --bad: #b3261e;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161c;
    --card: #18222b;
    --ink: #e8eef3;
    --mut: #93a4b3;
    --line: #2b3946;
    --c: #46c2c0;
    --v: #8aa2ff;
    --ok: #5fcf86;
    --bad: #ff8a80;
    color-scheme: dark;
  }
}
.sync { font-size: 12px; color: var(--mut); text-align: center; margin: -6px 0 10px; min-height: 16px; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 "Atkinson Hyperlegible", system-ui, sans-serif;
  max-width: 520px;
  margin-inline: auto;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 14px calc(40px + env(safe-area-inset-bottom, 0px));
}
h1 { font-size: 22px; margin: 4px 0 12px; text-align: center; font-weight: 700; }
button, input, select { font: inherit; color: var(--ink); }
.tabs { display: flex; gap: 4px; margin-bottom: 14px; overflow-x: auto; }
.tabs button {
  flex: 1;
  padding: 10px 2px;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 8px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}
.tabs button.on { background: var(--ink); color: var(--bg); }
.nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 18px; }
.nav button { width: 44px; height: 40px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-size: 20px; cursor: pointer; }
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
.cd { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.cd small { color: var(--mut); display: block; font-size: 12px; }
.cd b { font-size: 19px; }
.big { background: var(--card); border: 2px solid var(--v); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.warn, .okb, .alert-box { border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; border: 1px solid; line-height: 1.4; }
.warn { color: var(--bad); border-color: var(--bad); background: rgba(179,38,30,0.05); }
.okb { color: var(--ok); border-color: var(--ok); background: rgba(29,122,62,0.05); }
.alert-box { color: #d97706; border-color: #d97706; background: rgba(217,119,6,0.08); font-weight: 700; }
.row { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px; margin-bottom: 8px; width: 100%; text-align: left; cursor: pointer; }
.row.done { opacity: .55; }
.chk { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--mut); flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 14px; }
.done .chk { background: var(--ok); border-color: var(--ok); }
.grow { flex: 1; }
.grow small { color: var(--mut); display: block; font-size: 12px; }
.amt { font-weight: 700; }
.amt.in { color: var(--ok); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.card input, .card select, .fld input, .fld select { width: 100%; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin-top: 4px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
label { font-size: 13px; color: var(--mut); font-weight: 700; }
.add, .del { padding: 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); width: 100%; font-weight: 700; margin-top: 8px; cursor: pointer; }
.del { color: var(--bad); border-color: var(--bad); }
.wds { display: flex; gap: 5px; margin: 8px 0 14px; }
.wds button { flex: 1; padding: 10px 0; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-weight: 700; cursor: pointer; }
.wds button.on { background: var(--c); color: var(--bg); border-color: var(--c); }
.note { color: var(--mut); font-size: 13px; margin: 8px 2px; }
.row.hj { border: 2px solid var(--v); }
.rt { text-align: right; }
.rt small, .rt b { display: block; }
.row input { width: 96px; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }

/* Calendário e Mini-Calendários */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 12px; }
.cal-head { text-align: center; font-size: 12px; font-weight: 700; color: var(--mut); padding: 4px 0; }
.cal-day { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px; min-height: 58px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; text-align: left; position: relative; width: 100%; }
.cal-day.empty { background: transparent; border: none; cursor: default; }
.cal-day.hj { border: 2px solid var(--v); }
.cal-day.sel { border: 2px solid var(--c); background: rgba(14,124,123,0.08); }
.cal-num { font-weight: 700; font-size: 12px; color: var(--ink); }
.cal-dots { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; width: 100%; }
.cal-badge { font-size: 9px; padding: 1px 3px; border-radius: 4px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.cal-badge.in { background: rgba(29,122,62,0.18); color: var(--ok); }
.cal-badge.out { background: rgba(179,38,30,0.18); color: var(--bad); }
.cal-badge.wk { background: rgba(58,91,217,0.18); color: var(--v); }

.mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; }
.mini .mh { text-align: center; font-size: 11px; color: var(--mut); font-weight: 700; }
.mini button { padding: 8px 0; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; font-size: 13px; cursor: pointer; }
.mini button.on { background: var(--c); border-color: var(--c); color: var(--bg); }
.mini button.pass { opacity: 0.4; }
.mini .bl { visibility: hidden; }

.bar { height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 0 0 6px; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 6px; }
textarea { font: inherit; }
.perm { border-width: 2px; }
.perm .pb { display: flex; gap: 8px; }
.perm .pb button { flex: 1; padding: 11px 6px; border-radius: 8px; font-weight: 700; cursor: pointer; border: 1px solid var(--line); background: var(--card); }
.perm .pb .yes { background: var(--ok); color: var(--bg); border-color: var(--ok); }
.perm .pb .no { color: var(--bad); border-color: var(--bad); }
</style>
</head>
<body>

<!-- TELA DE LOGIN / CRIAR CONTA -->
<div id="auth-screen" style="display:none; max-width: 400px; margin: 40px auto; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 12px;">
  <h2 id="auth-title" style="text-align:center; margin-top:0;">Entrar na sua Conta</h2>
  <div class="card fld" style="border:none; padding:0; background:transparent;">
    <label>E-mail</label>
    <input type="email" id="auth-email" placeholder="seu@email.com" style="margin-bottom:10px;">
    <label>Senha</label>
    <input type="password" id="auth-pass" placeholder="••••••••" style="margin-bottom:14px;">
    <button class="add" id="auth-btn" style="background:var(--c); color:var(--bg);">Entrar</button>
    <button class="del" id="auth-switch" style="border:none; background:transparent; color:var(--v); margin-top:10px; cursor:pointer; width:100%;">Não tem conta? Criar uma agora</button>
    <div id="auth-msg" class="note" style="color:var(--bad); text-align:center; margin-top:8px;"></div>
  </div>
</div>

<!-- APLICAÇÃO PRINCIPAL -->
<div id="app-screen" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
    <h1>Planejamento Completo</h1>
    <button id="logout-btn" style="font-size:12px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--card); cursor:pointer;">Sair da Conta</button>
  </div>
  <div class="sync" id="sync"></div>
  <div style="margin-bottom: 10px;"><button class="add" data-a="notif" id="btn-notif" style="margin-top:0;background:var(--card);color:var(--ink);">🔔 Avisar vencimentos quando eu abrir o app</button></div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<script>
// ==========================================
// CONFIGURAÇÃO DO FIREBASE
// ==========================================
var firebaseConfig = {
  apiKey: "AIzaSyC5i5n9bMtr--hj_mw0km1RGiGWLXwPTQU",
  authDomain: "finaceiro-f268b.firebaseapp.com",
  projectId: "finaceiro-f268b",
  storageBucket: "finaceiro-f268b.firebasestorage.app",
  messagingSenderId: "425198285823",
  appId: "1:425198285823:web:34162e9c00afc1be5a6dca"
};

firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();
var currentUserUid = null;
var unsubscribeSync = null;

// ==========================================
// LÓGICA DO APLICATIVO
// ==========================================
var LASTAV = [], KEY = "plano-v2",
    MS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"],
    WN = ["dom","seg","ter","qua","qui","sex","sáb"],
    tab = 1, selDay = 0,
    currentYM = new Date().getFullYear() + "-" + ("0" + (new Date().getMonth() + 1)).slice(-2),
    S = {
      ym: currentYM, tipoRenda: "diaria", dia: 0, dias: [1,2,3,4,5],
      valQuinzena: 0, diaQ1: 5, diaQ2: 20, valMes: 0, diaMes: 5,
      ini: {}, paid: {}, gp: {}, rp: {}, carry: false, ex: [], bills: []
    };

try {
  var r = localStorage.getItem(KEY);
  if (r) S = JSON.parse(r);
} catch(e){}

function fix() {
  S.rp = S.rp || {}; S.au = S.au || {}; S.dw = S.dw || {}; S.real = S.real || {}; S.paid = S.paid || {}; S.gp = S.gp || {}; S.ini = S.ini || {}; S.rv = S.rv || {};
  if (!S.tipoRenda) S.tipoRenda = "diaria";
  if (S.dia === undefined) S.dia = 0;
  if (!S.dias) S.dias = [1,2,3,4,5];
  if (S.valQuinzena === undefined) S.valQuinzena = 0;
  if (S.diaQ1 === undefined) S.diaQ1 = 5;
  if (S.diaQ2 === undefined) S.diaQ2 = 20;
  if (S.valMes === undefined) S.valMes = 0;
  if (S.diaMes === undefined) S.diaMes = 5;
  S.carry = !!S.carry;
  S.bills = S.bills || [];
  S.ex = S.ex || [];
  S.bills.forEach(function(b){ if (!b.i) b.i = S.ym; if (!b.v) b.v = {}; });
  S.ex.forEach(function(x){ if (!x.i) x.i = S.ym; if (!x.v) x.v = {}; });
  if (!S.start) {
    var ms = [];
    S.bills.concat(S.ex).forEach(function(o){ if (o.i) ms.push(o.i); });
    S.start = ms.length ? ms.sort()[0] : S.ym;
  }
}
fix();

var CLOUD = { saving: false, again: false, timer: null };
function setSync(t) { var el = document.getElementById("sync"); if (el) el.textContent = t; }
function hora() { return new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

function save() {
  S.ts = Date.now();
  saveLocal();
  if (currentUserUid) {
    clearTimeout(CLOUD.timer);
    CLOUD.timer = setTimeout(cloudPush, 600);
    setSync("⏳ Salvando na nuvem…");
  }
}

function cloudPush() {
  if (!currentUserUid) return;
  if (CLOUD.saving) { CLOUD.again = true; return; }
  CLOUD.saving = true;
  var j = JSON.stringify(S), ts = S.ts || Date.now();
  db.collection("users").doc(currentUserUid).set({ json: j, ts: ts }).then(function(){
    CLOUD.saving = false;
    if (CLOUD.again) { CLOUD.again = false; cloudPush(); } else setSync("☁️ Sincronizado com a nuvem às " + hora());
  }).catch(function(err){
    CLOUD.saving = false;
    setSync("⚠️ Erro ao salvar na nuvem: " + err.message);
  });
}

function listenCloud(uid) {
  if (unsubscribeSync) unsubscribeSync();
  setSync("⏳ Carregando dados da nuvem…");
  
  unsubscribeSync = db.collection("users").doc(uid).onSnapshot(function(doc){
    if (doc.exists) {
      var data = doc.data();
      try {
        var rem = JSON.parse(data.json);
        if (rem && (rem.ts || 0) > (S.ts || 0)) {
          S = rem; fix(); START = S.start; CC = {}; MC = {}; saveLocal(); draw();
          setSync("☁️ Atualizado da nuvem às " + hora());
        } else if ((S.ts || 0) === 0) {
          S = rem; fix(); START = S.start; CC = {}; MC = {}; saveLocal(); draw();
          setSync("☁️ Dados carregados com sucesso");
        }
      } catch(e){}
    } else {
      cloudPush();
    }
  }, function(err){
    setSync("⚠️ Modo offline: usando dados locais");
  });
}

auth.onAuthStateChanged(function(user) {
  if (user) {
    currentUserUid = user.uid;
    document.getElementById("auth-screen").style.display = "none";
    document.getElementById("app-screen").style.display = "block";
    listenCloud(user.uid);
    draw();
  } else {
    currentUserUid = null;
    if (unsubscribeSync) { unsubscribeSync(); unsubscribeSync = null; }
    document.getElementById("auth-screen").style.display = "block";
    document.getElementById("app-screen").style.display = "none";
  }
});

var isRegMode = false;
document.getElementById("auth-switch").addEventListener("click", function(){
  isRegMode = !isRegMode;
  document.getElementById("auth-title").textContent = isRegMode ? "Criar Nova Conta" : "Entrar na sua Conta";
  document.getElementById("auth-btn").textContent = isRegMode ? "Registrar" : "Entrar";
  this.textContent = isRegMode ? "Já tem conta? Iniciar sessão" : "Não tem conta? Criar uma agora";
});

document.getElementById("auth-btn").addEventListener("click", function(){
  var email = document.getElementById("auth-email").value.trim();
  var pass = document.getElementById("auth-pass").value;
  var msgEl = document.getElementById("auth-msg");
  msgEl.textContent = "";

  if (!email || !pass) {
    msgEl.textContent = "Preencha o e-mail e a senha.";
    return;
  }

  if (isRegMode) {
    auth.createUserWithEmailAndPassword(email, pass).catch(function(error){
      msgEl.textContent = "Erro ao registrar: " + error.message;
    });
  } else {
    auth.signInWithEmailAndPassword(email, pass).catch(function(error){
      msgEl.textContent = "Erro ao entrar: " + error.message;
    });
  }
});

document.getElementById("logout-btn").addEventListener("click", function(){
  auth.signOut();
});

function onList(on) { var r = [], i; for (i = 1; i < on.length; i++) if (on[i]) r.push(i); return r; }
function billPlan(b, ym, dias, tmd) {
  var pq = ym.split("-"), Y = +pq[0], M = +pq[1], N = new Date(Y, M, 0).getDate(), fdw = new Date(Y, M-1, 1).getDay(),
