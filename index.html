<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planejamento Financeiro Completo</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f5;
  --card: #ffffff;
  --ink: #14202b;
  --mut: #5b6b79;
  --line: #d7dfe6;
  --c: #0e7c7b;
  --v: #3a5bd9;
  --ok: #1d7a3e;
  --bad: #b3261e;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161c;
    --card: #18222b;
    --ink: #e8eef3;
    --mut: #93a4b3;
    --line: #2b3946;
    --c: #46c2c0;
    --v: #8aa2ff;
    --ok: #5fcf86;
    --bad: #ff8a80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 "Atkinson Hyperlegible", system-ui, sans-serif;
  max-width: 520px;
  margin-inline: auto;
  padding: 14px 14px 40px;
}
h1 { font-size: 22px; margin: 4px 0 12px; text-align: center; font-weight: 700; }
button, input, select { font: inherit; color: var(--ink); }
.tabs { display: flex; gap: 4px; margin-bottom: 14px; overflow-x: auto; }
.tabs button {
  flex: 1;
  padding: 10px 2px;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 8px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}
.tabs button.on { background: var(--ink); color: var(--bg); }
.nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 18px; }
.nav button { width: 44px; height: 40px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-size: 20px; cursor: pointer; }
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
.cd { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.cd small { color: var(--mut); display: block; font-size: 12px; }
.cd b { font-size: 19px; }
.big { background: var(--card); border: 2px solid var(--v); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.warn, .okb, .alert-box { border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; border: 1px solid; line-height: 1.4; }
.warn { color: var(--bad); border-color: var(--bad); background: rgba(179,38,30,0.05); }
.okb { color: var(--ok); border-color: var(--ok); background: rgba(29,122,62,0.05); }
.alert-box { color: #d97706; border-color: #d97706; background: rgba(217,119,6,0.08); font-weight: 700; }
.row { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px; margin-bottom: 8px; width: 100%; text-align: left; cursor: pointer; }
.row.done { opacity: .55; }
.chk { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--mut); flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 14px; }
.done .chk { background: var(--ok); border-color: var(--ok); }
.grow { flex: 1; }
.grow small { color: var(--mut); display: block; font-size: 12px; }
.amt { font-weight: 700; }
.amt.in { color: var(--ok); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.card input, .card select, .fld input, .fld select { width: 100%; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin-top: 4px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
label { font-size: 13px; color: var(--mut); font-weight: 700; }
.add, .del { padding: 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); width: 100%; font-weight: 700; margin-top: 8px; cursor: pointer; }
.del { color: var(--bad); border-color: var(--bad); }
.wds { display: flex; gap: 5px; margin: 8px 0 14px; }
.wds button { flex: 1; padding: 10px 0; border: 1px solid var(--line); background: var(--card); border-radius: 8px; font-weight: 700; cursor: pointer; }
.wds button.on { background: var(--c); color: var(--bg); border-color: var(--c); }
.note { color: var(--mut); font-size: 13px; margin: 8px 2px; }
.row.hj { border: 2px solid var(--v); }
.rt { text-align: right; }
.rt small, .rt b { display: block; }
.row input { width: 96px; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }

/* Estilos do Calendário Real */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 12px; }
.cal-head { text-align: center; font-size: 12px; font-weight: 700; color: var(--mut); padding: 4px 0; }
.cal-day {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px;
  min-height: 58px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  text-align: left;
  position: relative;
  width: 100%;
}
.cal-day.empty { background: transparent; border: none; cursor: default; }
.cal-day.hj { border: 2px solid var(--v); }
.cal-day.sel { border: 2px solid var(--c); background: rgba(14,124,123,0.08); }
.cal-num { font-weight: 700; font-size: 12px; color: var(--ink); }
.cal-dots { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; width: 100%; }
.cal-badge { font-size: 9px; padding: 1px 3px; border-radius: 4px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.cal-badge.in { background: rgba(29,122,62,0.18); color: var(--ok); }
.cal-badge.out { background: rgba(179,38,30,0.18); color: var(--bad); }
.cal-badge.wk { background: rgba(58,91,217,0.18); color: var(--v); }
</style>
</head>
<body>
<h1>Planejamento Completo</h1>
<div style="margin-bottom: 10px;"><button class="add" data-a="notif" id="btn-notif" style="margin-top:0;background:var(--card);color:var(--ink);">🔔 Ativar Lembretes de Vencimento</button></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>

<script>
var KEY = "plano-v2",
    MS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"],
    WN = ["dom","seg","ter","qua","qui","sex","sáb"],
    tab = 0, selDay = 0,
    currentYM = new Date().getFullYear() + "-" + ("0" + (new Date().getMonth() + 1)).slice(-2),
    S = {
      ym: currentYM,
      tipoRenda: "diaria",
      dia: 0,
      dias: [1,2,3,4,5],
      valQuinzena: 0,
      diaQ1: 5,
      diaQ2: 20,
      valMes: 0,
      diaMes: 5,
      ini: {},
      paid: {},
      gp: {},
      rp: {},
      carry: false,
      ex: [],
      bills: []
    };

try {
  var r = localStorage.getItem(KEY);
  if (r) S = JSON.parse(r);
} catch(e){}

function fix() {
  S.rp = S.rp || {};
  S.paid = S.paid || {};
  S.gp = S.gp || {};
  if (!S.tipoRenda) S.tipoRenda = "diaria";
  if (S.valQuinzena === undefined) S.valQuinzena = 0;
  if (S.diaQ1 === undefined) S.diaQ1 = 5;
  if (S.diaQ2 === undefined) S.diaQ2 = 20;
  if (S.valMes === undefined) S.valMes = 0;
  if (S.diaMes === undefined) S.diaMes = 5;
  S.bills = S.bills || [];
  S.ex = S.ex || [];
  S.bills.forEach(function(b){ if(!b.i) b.i = S.ym; });
  S.ex.forEach(function(x){ if(!x.i) x.i = S.ym; });
}
fix();

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
}

function F(n) { return (n || 0).toFixed(2).replace(".",",").replace(/,00$/,""); }
function R(n) { return "R$ " + F(n); }
function inp(sc, id, f, v, ty) {
  return '<input data-s="'+sc+'" data-i="'+id+'" data-f="'+f+'" type="'+ty+'" value="'+String(v).replace(/"/g,"&quot;")+'"'+(ty=="number"?' step="0.01" inputmode="decimal"':'')+'>';
}

var START = S.ym;
function prevYM(ym) {
  var p = ym.split("-"), d = new Date(+p[0], +p[1]-2, 1);
  return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2);
}
function carry(ym) {
  if (ym <= START) return { p: 0, m: 0 };
  var o = S.ym; S.ym = prevYM(ym);
  var s = serie(), l = s[s.length-1];
  S.ym = o;
  return { p: l.pote, m: l.mim };
}

function XS() { return S.ex.filter(function(x){ return !x.i || S.ym >= x.i; }); }
function XT() { return XS().filter(function(x){ return S.rp[S.ym] || !x.i || x.i == S.ym; }); }
function ini0() { return S.carry ? carry(S.ym).p : (+S.ini[S.ym] || 0); }
function mim0() { return S.carry ? carry(S.ym).m : 0; }

function calc() {
  var p = S.ym.split("-"), Y = +p[0], M = +p[1], N = new Date(Y, M, 0).getDate(), wd = [], w = 0, d;
  for (d = 1; d <= N; d++) {
    var k = S.dias.indexOf(new Date(Y, M-1, d).getDay()) >= 0;
    wd[d] = k; if (k) w++;
  }
  var L = S.bills.filter(function(b){ return (!b.i || S.ym >= b.i) && (!b.f || S.ym <= b.f); }),
      ex = XS().reduce(function(s, x){ return s + x.a; }, 0),
      wk = S.dias.length || 1, tot = 0, ud = 0;
  L.forEach(function(b){ if (b.t == "s") { tot += b.a * w / wk; ud += b.a / wk; } else tot += b.a; });
  
  var principalRendaTotal = 0;
  if (S.tipoRenda === "diaria") principalRendaTotal = S.dia * w;
  else if (S.tipoRenda === "quinzena") principalRendaTotal = S.valQuinzena * 2;
  else if (S.tipoRenda === "mes") principalRendaTotal = S.valMes;

  var g = 0;
  if (S.tipoRenda === "diaria") {
    g = w ? Math.min(S.dia, Math.max(0, Math.ceil((tot - ex) * 1.2 / w))) : 0;
  }
  
  var bal = ini0(), min = bal, md = 0;
  for (d = 1; d <= N; d++) {
    if (S.tipoRenda === "diaria" && wd[d]) bal += g - ud;
    if (S.tipoRenda === "quinzena" && (d === Math.min(S.diaQ1, N) || d === Math.min(S.diaQ2, N))) {
      bal += S.valQuinzena;
    }
    if (S.tipoRenda === "mes" && d === Math.min(S.diaMes, N)) {
      bal += S.valMes;
    }
    XS().forEach(function(x){ if (Math.min(x.d, N) == d) bal += x.a; });
    L.forEach(function(b){ if (b.t != "s" && Math.min(b.d || 1, N) == d) bal -= b.a; });
    if (bal < min) { min = bal; md = d; }
  }
  
  var cobrir = 0;
  if (min < 0) { cobrir = Math.abs(min); }
  
  return { Y: Y, M: M, N: N, w: w, L: L, inc: principalRendaTotal + ex, tot: tot, g: g, min: min, md: md, wk: wk, ud: ud, cobrir: cobrir };
}

function RS(c) {
  var pg = 0, en = 0, nd = 0, q0,
      LT = c.L.filter(function(b){ return S.rp[S.ym] || !b.i || b.i == S.ym; }),
      XTT = XT(), tT = 0, iT = 0;

  if (S.tipoRenda === "diaria") iT = S.dia * c.w;
  else if (S.tipoRenda === "quinzena") iT = S.valQuinzena * 2;
  else if (S.tipoRenda === "mes") iT = S.valMes;

  LT.forEach(function(b){ tT += b.t == "s" ? b.a * c.w / c.wk : b.a; });
  XTT.forEach(function(x){ iT += x.a; });

  if (S.tipoRenda === "diaria") {
    for (q0 = 1; q0 <= c.N; q0++) if (S.dias.indexOf(new Date(c.Y, c.M-1, q0).getDay()) >= 0 && S.paid[S.ym + "d" + q0]) nd++;
    en = nd * S.dia;
  } else if (S.tipoRenda === "quinzena") {
    if (S.paid[S.ym + "q1"]) en += S.valQuinzena;
    if (S.paid[S.ym + "q2"]) en += S.valQuinzena;
  } else if (S.tipoRenda === "mes") {
    if (S.paid[S.ym + "mes1"]) en += S.valMes;
  }

  XTT.forEach(function(x){ if (S.paid[S.ym + x.id]) en += x.a; });
  LT.forEach(function(b){ if (b.t == "s") pg += nd * b.a / c.wk; else if (S.paid[S.ym + b.id]) pg += b.a; });
  return { pg: pg, en: en, nd: nd, tT: tT, iT: iT };
}

function mao(ym) {
  if (ym <= START) return 0;
  var pv = prevYM(ym), o = S.ym; S.ym = pv;
  var r = RS(calc()), v = mao(pv) + r.en - r.pg;
  S.ym = o; return v;
}

function vMes() {
  var c = calc(),
      h = '<div class="nav"><button data-a="pm">‹</button><b>' + MS[c.M-1] + ' de ' + c.Y + '</b><button data-a="nm">›</button></div>';
  
  // Verificação de alertas para o dia de hoje
  var td = new Date();
  var isCurrentMonth = td.getFullYear() == c.Y && (td.getMonth() + 1) == c.M;
  if (isCurrentMonth) {
    var hojeD = td.getDate();
    var avisosHoje = [];
    c.L.forEach(function(b){
      if (b.t !== "s" && b.d === hojeD) avisosHoje.push("Conta a vencer hoje: " + b.n + " (" + R(b.a) + ")");
    });
    XS().forEach(function(x){
      if (x.d === hojeD) avisosHoje.push("Renda a cair hoje: " + x.n + " (" + R(x.a) + ")");
    });
    if (avisosHoje.length > 0) {
      h += '<div class="alert-box">🔔 <b>Avisos para hoje:</b><br>' + avisosHoje.join("<br>") + '</div>';
    }
  }

  var rs = RS(c), pg = rs.pg, en = rs.en, nd = rs.nd, tT = rs.tT, iT = rs.iT, mc = mao(S.ym), fl = Math.max(0, tT - pg);
  
  var sobraEmMaosLiquida = (mc + en - pg) - c.cobrir;
  if (sobraEmMaosLiquida < 0) sobraEmMaosLiquida = 0;

  h += '<div class="cards">' +
       '<div class="cd"><small>Entra no mês</small><b>' + R(iT) + '</b></div>' +
       '<div class="cd"><small>Contas do mês</small><b>' + R(tT) + '</b></div>' +
       '<div class="cd"><small>Já paguei</small><b style="color:var(--ok)">' + R(pg) + '</b></div>' +
       '<div class="cd"><small>Falta pagar</small><b style="color:var(--bad)">' + R(fl) + '</b></div>' +
       '<div class="cd"><small>Entrou até agora</small><b>' + R(en) + '</b></div>' +
       '<div class="cd"><small>Sobra em mãos</small><b style="color:var(--v)">' + R(sobraEmMaosLiquida) + '</b></div>' +
       '</div>' +
       '<div class="note">Previsão de sobra no fim do mês: <b>' + R(mc + iT - tT) + '</b>' +
       (S.tipoRenda === "diaria" ? ' · ' + nd + ' de ' + c.w + ' diárias marcadas' : '') +
       (Math.abs(mc) > 0.005 ? '<br>Inclui ' + R(mc) + ' que sobrou dos meses anteriores.' : '') + '</div>';

  h += '<button class="add" data-a="rep" style="margin:0 0 10px">' +
       (S.rp[S.ym] ? "✓ Resumo de cima inclui contas e rendas dos meses anteriores (toque pra desligar)" : "Incluir contas e rendas dos meses anteriores no resumo de cima (desligado)") +
       '</button>';

  if (S.tipoRenda === "diaria") {
    h += '<div class="big">Em cada diária de ' + R(S.dia) + ': separe <b>' + R(c.g) + '</b> pro pote das contas e fique com <b>' + R(S.dia - c.g) + '</b> pra você.<small style="display:block;color:var(--mut);font-size:12px;margin-top:4px">Já inclui 20% de folga pro mês que vem.</small></div>';
  } else if (S.tipoRenda === "quinzena") {
    h += '<div class="big">Renda Quinzenal: Cada quinzena entra <b>' + R(S.valQuinzena) + '</b> (dias ' + S.diaQ1 + ' e ' + S.diaQ2 + ').</div>';
  } else if (S.tipoRenda === "mes") {
    h += '<div class="big">Salário Mensal: Entra <b>' + R(S.valMes) + '</b> no dia ' + S.diaMes + '.</div>';
  }

  if (c.cobrir > 0) {
    h += '<div class="okb" style="border-color:var(--v);color:var(--v);background:rgba(58,91,217,0.08)">' +
         '<b>Ajuste Automático do Pote:</b> Para evitar saldo negativo no dia ' + c.md + ', <b>' + R(c.cobrir) + '</b> foram descontados da sua "Sobra em mãos" e transferidos pro pote das contas. Assim, nenhum pagamento fica no vermelho!</div>';
  } else {
    h += '<div class="okb">O pote das contas aguenta todos os pagamentos do mês perfeitamente.</div>';
  }

  var hj = isCurrentMonth && S.dias.indexOf(td.getDay()) >= 0;
  if (hj && S.tipoRenda === "diaria" && S.dia > 0) {
    h += '<div class="big">Hoje (' + WN[td.getDay()] + ' ' + td.getDate() + '): ao receber a diária, separe <b>' + R(c.g - c.ud) + '</b> pro pote das contas e fique com <b>' + R(S.dia - c.g) + '</b>.</div>';
  }

  var cy = carry(S.ym);
  h += '<button class="add" data-a="carry" style="margin:0 0 10px">' +
       (S.carry ? "✓ Somando o que sobrou do mês anterior (toque pra desligar)" : "Somar o que sobrou do mês anterior (desligado)") +
       '</button>';
  
  h += S.carry ? '<div class="note">Veio do mês anterior: pote ' + R(cy.p) + ' · pra mim ' + R(cy.m) + '</div>'
              : '<div class="card fld"><label>Começar o mês com este valor no pote (R$)</label>' + inp("c","0","ini",S.ini[S.ym]||0,"number") + '</div>';

  if (S.tipoRenda === "diaria" && S.dia > 0) {
    h += '<div class="note"><b>Separar a cada diária</b><br>Ao receber o dinheiro de cada dia, separe assim e toque pra marcar.</div>';
    for (var q = 1; q <= c.N; q++) {
      if (S.dias.indexOf(new Date(c.Y, c.M-1, q).getDay()) < 0) continue;
      var dn2 = S.paid[S.ym + "d" + q];
      h += '<button class="row' + (dn2 ? " done" : "") + '" data-a="tog" data-i="d' + q + '">' +
           '<span class="chk">' + (dn2 ? "✓" : "") + '</span>' +
           '<span class="grow"><b>' + WN[new Date(c.Y, c.M-1, q).getDay()] + ' ' + q + '</b><small>Contas ' + R(c.g - c.ud) + ' · Você ' + R(S.dia - c.g) + '</small></span>' +
           '</button>';
    }
  } else if (S.tipoRenda === "quinzena" && S.valQuinzena > 0) {
    h += '<div class="note"><b>Recebimentos da Quinzena</b></div>';
    var q1Done = S.paid[S.ym + "q1"], q2Done = S.paid[S.ym + "q2"];
    h += '<button class="row' + (q1Done ? " done" : "") + '" data-a="tog" data-i="q1">' +
         '<span class="chk">' + (q1Done ? "✓" : "") + '</span>' +
         '<span class="grow"><b>1ª Quinzena (Dia ' + S.diaQ1 + ')</b><small>Recebimento quinzenal</small></span>' +
         '<span class="amt in">+' + R(S.valQuinzena) + '</span></button>';
    h += '<button class="row' + (q2Done ? " done" : "") + '" data-a="tog" data-i="q2">' +
         '<span class="chk">' + (q2Done ? "✓" : "") + '</span>' +
         '<span class="grow"><b>2ª Quinzena (Dia ' + S.diaQ2 + ')</b><small>Recebimento quinzenal</small></span>' +
         '<span class="amt in">+' + R(S.valQuinzena) + '</span></button>';
  } else if (S.tipoRenda === "mes" && S.valMes > 0) {
    h += '<div class="note"><b>Salário Mensal</b></div>';
    var mDone = S.paid[S.ym + "mes1"];
    h += '<button class="row' + (mDone ? " done" : "") + '" data-a="tog" data-i="mes1">' +
         '<span class="chk">' + (mDone ? "✓" : "") + '</span>' +
         '<span class="grow"><b>Salário (Dia ' + S.diaMes + ')</b><small>Recebimento mensal fixo</small></span>' +
         '<span class="amt in">+' + R(S.valMes) + '</span></button>';
  }

  h += '<div class="note"><b>Pagamentos do mês</b></div>';
  if (c.L.length === 0 && XS().length === 0) {
    h += '<div class="card" style="text-align:center;color:var(--mut);padding:16px;">Nenhuma conta ou renda extra cadastrada. Vá na aba <b>Contas</b> ou <b>Renda</b> para adicionar.</div>';
  }

  var it = [];
  c.L.forEach(function(b){
    if (b.t == "s") it.push({ d: 99, n: b.n, a: b.a * c.w / c.wk, s: R(b.a) + " por semana, separe todo dia", id: b.id, w: 1 });
    else it.push({ d: Math.min(b.d || 1, c.N), n: b.n, a: b.a, id: b.id });
  });
  XS().forEach(function(x){ it.push({ d: Math.min(x.d, c.N), n: x.n, a: x.a, id: x.id, x: 1 }); });
  it.sort(function(a,b){ return a.d - b.d; });

  it.forEach(function(o){
    var dn = o.d == 99 ? "" : WN[new Date(c.Y, c.M-1, o.d).getDay()] + " " + o.d + " · ",
        done = S.paid[S.ym + o.id];
    h += '<button class="row' + (done ? " done" : "") + '" data-a="tog" data-i="' + o.id + '">' +
         '<span class="chk">' + (done ? "✓" : "") + '</span>' +
         '<span class="grow"><b>' + o.n + '</b><small>' + (o.s || dn + (o.x ? "cai na conta" : "pagar")) + '</small></span>' +
         '<span class="amt' + (o.x ? " in" : "") + '">' + (o.x ? "+" : "") + R(o.a) + '</span>' +
         '</button>';
  });

  return h + '<p class="note">Toque numa conta pra marcar como paga. O mês seguinte começa limpo.</p>';
}

function vContas() {
  var h = '<p class="note">Adicione as suas contas mensais ou semanais. O planeamento recalcula tudo automaticamente!</p>';
  if (S.bills.length === 0) {
    h += '<div class="card" style="text-align:center;color:var(--mut);padding:16px;">Nenhuma conta cadastrada ainda.</div>';
  }
  S.bills.forEach(function(b){
    h += '<div class="card">' + inp("b", b.id, "n", b.n, "text") +
         '<div class="g2">' +
         '<div><label>Valor (R$)</label>' + inp("b", b.id, "a", b.a, "number") + '</div>' +
         '<div><label>Tipo</label><select data-s="b" data-i="' + b.id + '" data-f="t"><option value="m"' + (b.t=="m"?" selected":"") + '>Mensal</option><option value="s"' + (b.t=="s"?" selected":"") + '>Semanal</option></select></div>' +
         (b.t=="m" ? '<div><label>Dia do mês</label>' + inp("b", b.id, "d", b.d, "number") + '</div>' : '') +
         '<div><label>Começa</label>' + inp("b", b.id, "i", b.i, "month") + '</div>' +
         '<div><label>Termina</label>' + inp("b", b.id, "f", b.f, "month") + '</div>' +
         '</div>' +
         '<button class="del" data-a="delb" data-i="' + b.id + '">Remover conta</button>' +
         '</div>';
  });
  return h + '<button class="add" data-a="addb">+ Nova conta</button>';
}

function vRenda() {
  var h = '<div class="card fld"><label>Como você recebe sua renda principal?</label>' +
          '<select data-s="c" data-i="0" data-f="tipoRenda">' +
          '<option value="diaria"' + (S.tipoRenda==="diaria"?" selected":"") + '>Por Diária (Dias da semana)</option>' +
          '<option value="quinzena"' + (S.tipoRenda==="quinzena"?" selected":"") + '>Por Quinzena (A cada 15 dias)</option>' +
          '<option value="mes"' + (S.tipoRenda==="mes"?" selected":"") + '>Por Mês (Fixo mensal)</option>' +
          '</select></div>';

  if (S.tipoRenda === "diaria") {
    h += '<div class="card fld"><label>Valor da diária (R$)</label>' + inp("c","0","dia",S.dia,"number") + '</div>' +
         '<label>Dias em que você trabalha</label><div class="wds">';
    [1,2,3,4,5,6,0].forEach(function(i){
      h += '<button class="' + (S.dias.indexOf(i)>=0 ? "on" : "") + '" data-a="wd" data-i="' + i + '">' + WN[i] + '</button>';
    });
    h += '</div>';
  } else if (S.tipoRenda === "quinzena") {
    h += '<div class="card"><label>Valor recebido por Quinzena (R$)</label>' + inp("c","0","valQuinzena",S.valQuinzena,"number") +
         '<div class="g2">' +
         '<div><label>Dia 1º Pagamento</label>' + inp("c","0","diaQ1",S.diaQ1,"number") + '</div>' +
         '<div><label>Dia 2º Pagamento</label>' + inp("c","0","diaQ2",S.diaQ2,"number") + '</div>' +
         '</div></div>';
  } else if (S.tipoRenda === "mes") {
    h += '<div class="card"><label>Valor do Salário Mensal (R$)</label>' + inp("c","0","valMes",S.valMes,"number") +
         '<label>Dia do pagamento</label>' + inp("c","0","diaMes",S.diaMes,"number") + '</div>';
  }

  h += '<label>Outras rendas por mês (Bolsa Família, extras, etc.)</label>';
  if (S.ex.length === 0) {
    h += '<div class="card" style="text-align:center;color:var(--mut);padding:12px;margin-top:6px;">Nenhuma renda extra cadastrada.</div>';
  }
  S.ex.forEach(function(x){
    h += '<div class="card" style="margin-top:8px">' + inp("x", x.id, "n", x.n, "text") +
         '<div class="g2">' +
         '<div><label>Valor (R$)</label>' + inp("x", x.id, "a", x.a, "number") + '</div>' +
         '<div><label>Dia que cai</label>' + inp("x", x.id, "d", x.d, "number") + '</div>' +
         '<div><label>Começa</label>' + inp("x", x.id, "i", x.i||"", "month") + '</div>' +
         '</div>' +
         '<button class="del" data-a="delx" data-i="' + x.id + '">Remover</button>' +
         '</div>';
  });
  return h + '<button class="add" data-a="addx">+ Nova renda</button>';
}

function serie() {
  var c = calc(), out = [], bal = ini0() + c.cobrir, mim = mim0() - c.cobrir;
  for (var d = 1; d <= c.N; d++) {
    var wk = S.dias.indexOf(new Date(c.Y, c.M-1, d).getDay()) >= 0, ev = [], dep = 0;
    
    if (S.tipoRenda === "diaria" && wk) { dep = c.g - c.ud; bal += dep; mim += S.dia - c.g; }
    if (S.tipoRenda === "quinzena" && (d === Math.min(S.diaQ1, c.N) || d === Math.min(S.diaQ2, c.N))) {
      bal += S.valQuinzena;
      ev.push({ n: "Renda Quinzenal", a: S.valQuinzena, in: 1 });
    }
    if (S.tipoRenda === "mes" && d === Math.min(S.diaMes, c.N)) {
      bal += S.valMes;
      ev.push({ n: "Salário Mensal", a: S.valMes, in: 1 });
    }

    XS().forEach(function(x){ if (Math.min(x.d, c.N) == d) { bal += x.a; ev.push({ n: x.n, a: x.a, in: 1 }); } });
    c.L.forEach(function(b){ if (b.t != "s" && Math.min(b.d || 1, c.N) == d) { bal -= b.a; ev.push({ n: b.n, a: b.a }); } });
    mim -= (S.gp || {})[S.ym + "d" + d] || 0;
    out.push({ d: d, wk: wk, dep: dep, ev: ev, pote: bal, mim: Math.max(0, mim) });
  }
  return out;
}

function vSaldo() {
  var c = calc(), s = serie(), vs = [0],
      h = '<div class="nav"><button data-a="pm">‹</button><b>' + MS[c.M-1] + ' de ' + c.Y + '</b><button data-a="nm">›</button></div>';
  s.forEach(function(x){ vs.push(x.pote, x.mim); });
  var mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs), rg = (mx - mn) || 1, W = 300, H = 130;
  function X(d) { return 4 + (d - 1) * (W - 8) / Math.max(1, c.N - 1); }
  function Y(v) { return H - 6 - (v - mn) * (H - 12) / rg; }
  function pl(k) { return s.map(function(x){ return X(x.d).toFixed(1) + "," + Y(x[k]).toFixed(1); }).join(" "); }
  
  h += '<div class="card"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img"><line x1="0" x2="' + W + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '" stroke="var(--line)" stroke-dasharray="4 3"/><polyline fill="none" stroke="var(--c)" stroke-width="2.5" points="' + pl("pote") + '"/><polyline fill="none" stroke="var(--v)" stroke-width="2.5" points="' + pl("mim") + '"/></svg><div class="note"><span style="color:var(--c)">●</span> Pote das contas &nbsp; <span style="color:var(--v)">●</span> Pra mim</div></div>';
  h += '<p class="note">O saldo sobe com as entradas de renda e desce nos dias de pagamento.</p>';
  var td = new Date(), tdd = (td.getFullYear() == c.Y && td.getMonth() + 1 == c.M) ? td.getDate() : 0;
  
  s.forEach(function(x){
    h += '<div class="row' + (x.d == tdd ? " hj" : "") + '" style="align-items:flex-start"><div class="grow"><b>' + WN[new Date(c.Y, c.M-1, x.d).getDay()] + ' ' + x.d + '</b><small>' + (S.tipoRenda==="diaria" && x.wk ? "Separou " + R(x.dep) + " no pote" : "") + '</small>' +
         x.ev.map(function(e){ return '<small style="color:' + (e.in ? "var(--ok)" : "var(--bad)") + '">' + (e.in ? "+ " : "− ") + e.n + " " + R(e.a) + '</small>'; }).join("") +
         (S.tipoRenda==="diaria" && x.wk ? '<small>Gastei do pra mim: ' + inp("g", x.d, "g", (S.gp || {})[S.ym + "d" + x.d] || 0, "number") + '</small>' : '') +
         '</div><div class="rt"><small>Pote</small><b style="color:var(--c)">' + R(x.pote) + '</b><small>Pra mim</small><b style="color:var(--v)">' + R(x.mim) + '</b></div></div>';
  });
  return h;
}

function vCalendario() {
  var c = calc(), s = serie(),
      h = '<div class="nav"><button data-a="pm">‹</button><b>' + MS[c.M-1] + ' de ' + c.Y + '</b><button data-a="nm">›</button></div>';
  
  var firstDay = new Date(c.Y, c.M - 1, 1).getDay();
  var totalDays = c.N;
  var today = new Date();
  var isCurrentMonth = today.getFullYear() == c.Y && (today.getMonth() + 1) == c.M;
  var todayDate = isCurrentMonth ? today.getDate() : 0;
  
  if (!selDay || selDay > totalDays) selDay = todayDate || 1;
  
  h += '<div class="cal-grid">';
  WN.forEach(function(w){ h += '<div class="cal-head">' + w.toUpperCase() + '</div>'; });
  
  for (var i = 0; i < firstDay; i++) {
    h += '<div class="cal-day empty"></div>';
  }
  
  for (var d = 1; d <= totalDays; d++) {
    var dayOfWeek = new Date(c.Y, c.M - 1, d).getDay();
    var isWk = S.tipoRenda === "diaria" && S.dias.indexOf(dayOfWeek) >= 0;
    var dayEv = s[d-1].ev;
    var isToday = d === todayDate;
    var isSel = d === selDay;
    
    var cls = "cal-day" + (isToday ? " hj" : "") + (isSel ? " sel" : "");
    h += '<div class="' + cls + '" data-a="selday" data-i="' + d + '">';
    h += '<span class="cal-num">' + d + '</span>';
    h += '<div class="cal-dots">';
    if (isWk) h += '<span class="cal-badge wk">Diária</span>';
    dayEv.forEach(function(e){
      h += '<span class="cal-badge ' + (e.in ? 'in' : 'out') + '">' + e.n + '</span>';
    });
    h += '</div></div>';
  }
  h += '</div>';
  
  var selInfo = s[selDay - 1];
  var selDateObj = new Date(c.Y, c.M - 1, selDay);
  var selWn = WN[selDateObj.getDay()];
  
  h += '<div class="card" style="border:2px solid var(--c);">';
  h += '<b>' + selWn.toUpperCase() + ', ' + selDay + ' DE ' + MS[c.M-1].toUpperCase() + '</b>';
  h += '<p class="note" style="margin-top:4px;">Resumo deste dia no calendário</p>';
  
  if (S.tipoRenda === "diaria" && S.dias.indexOf(selDateObj.getDay()) >= 0) {
    var dn2 = S.paid[S.ym + "d" + selDay];
    h += '<button class="row' + (dn2 ? " done" : "") + '" data-a="tog" data-i="d' + selDay + '" style="margin-top:8px;">' +
         '<span class="chk">' + (dn2 ? "✓" : "") + '</span>' +
         '<span class="grow"><b>Diária de Trabalho</b><small>Entra ' + R(S.dia) + '</small></span>' +
         '</button>';
  }
  
  if (selInfo.ev.length === 0) {
    h += '<p class="note">Nenhum pagamento ou recebimento agendado para este dia.</p>';
  } else {
    selInfo.ev.forEach(function(e){
      var itemBill = c.L.filter(function(b){ return b.n == e.n; })[0];
      var itemInc = XS().filter(function(x){ return x.n == e.n; })[0];
      var itemId = itemBill ? itemBill.id : (itemInc ? itemInc.id : "");
      var done = itemId ? S.paid[S.ym + itemId] : false;
      
      if (itemId) {
        h += '<button class="row' + (done ? " done" : "") + '" data-a="tog" data-i="' + itemId + '" style="margin-top:6px;">' +
             '<span class="chk">' + (done ? "✓" : "") + '</span>' +
             '<span class="grow"><b>' + e.n + '</b><small>' + (e.in ? "Renda caindo na conta" : "Conta a pagar") + '</small></span>' +
             '<span class="amt' + (e.in ? " in" : "") + '">' + (e.in ? "+" : "") + R(e.a) + '</span>' +
             '</button>';
      } else {
        h += '<div class="row" style="margin-top:6px;"><span class="grow"><b>' + e.n + '</b></span><span class="amt' + (e.in ? " in" : "") + '">' + R(e.a) + '</span></div>';
      }
    });
  }
  
  h += '<div style="display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--mut);border-top:1px solid var(--line);padding-top:8px;">' +
       '<span>Pote no fim do dia: <b style="color:var(--c)">' + R(selInfo.pote) + '</b></span>' +
       '<span>Pra você: <b style="color:var(--v)">' + R(selInfo.mim) + '</b></span>' +
       '</div>';
  h += '</div>';
  
  return h;
}

function draw() {
  document.getElementById("tabs").innerHTML = ["Mês","Saldo","Calendário","Contas","Renda"].map(function(n,i){
    return '<button data-a="tab" data-i="'+i+'" class="'+(i==tab?"on":"")+'">'+n+'</button>';
  }).join("");
  document.getElementById("view").innerHTML = [vMes, vSaldo, vCalendario, vContas, vRenda][tab]();
  
  // Atualiza o estado do botão de notificações
  var btnNotif = document.getElementById("btn-notif");
  if (btnNotif) {
    if (window.Notification && Notification.permission === "granted") {
      btnNotif.innerHTML = "🔔 Lembretes Ativados";
      btnNotif.style.background = "rgba(29,122,62,0.15)";
      btnNotif.style.color = "var(--ok)";
    }
  }
}

document.addEventListener("change", function(e){
  var t = e.target, sc = t.dataset.s; if (!sc) return;
  var f = t.dataset.f, v = t.value;
  if (sc == "g") { S.gp = S.gp || {}; S.gp[S.ym + "d" + t.dataset.i] = parseFloat(v) || 0; }
  else if (sc == "c") {
    if (f == "tipoRenda") S.tipoRenda = v;
    else if (f == "ini") S.ini[S.ym] = parseFloat(v) || 0;
    else if (f == "dia") S.dia = parseFloat(v) || 0;
    else if (f == "valQuinzena") S.valQuinzena = parseFloat(v) || 0;
    else if (f == "diaQ1") S.diaQ1 = parseInt(v) || 1;
    else if (f == "diaQ2") S.diaQ2 = parseInt(v) || 15;
    else if (f == "valMes") S.valMes = parseFloat(v) || 0;
    else if (f == "diaMes") S.diaMes = parseInt(v) || 5;
  }
  else {
    var o = (sc == "b" ? S.bills : S.ex).filter(function(x){ return x.id == t.dataset.i; })[0];
    if (o) o[f] = (f == "a" || f == "d") ? (parseFloat(v) || 0) : v;
  }
  save(); draw();
});

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-a]"); if (!t) return;
  var a = t.dataset.a, i = t.dataset.i;
  if (a == "tab") tab = +i;
  else if (a == "pm" || a == "nm") {
    var p = S.ym.split("-"), d = new Date(+p[0], +p[1] - 1 + (a == "nm" ? 1 : -1), 1);
    S.ym = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2);
    selDay = 1;
  }
  else if (a == "selday") selDay = +i;
  else if (a == "tog") { var k = S.ym + i; S.paid[k] = !S.paid[k]; }
  else if (a == "wd") { var x = S.dias.indexOf(+i); if (x < 0) S.dias.push(+i); else S.dias.splice(x, 1); }
  else if (a == "rep") S.rp[S.ym] = !S.rp[S.ym];
  else if (a == "carry") S.carry = !S.carry;
  else if (a == "notif") {
    if (window.Notification) {
      Notification.requestPermission().then(function(perm){
        if (perm === "granted") {
          new Notification("Planejamento Financeiro", { body: "Lembretes ativados com sucesso!" });
          draw();
        } else {
          alert("Permissão de notificação negada pelo navegador.");
        }
      });
    } else {
      alert("Este navegador não suporta notificações.");
    }
  }
  else if (a == "addb") S.bills.push({ id: "b" + Date.now(), n: "Nova conta", a: 0, d: 1, t: "m", i: S.ym, f: "" });
  else if (a == "addx") S.ex.push({ id: "x" + Date.now(), n: "Nova renda", a: 0, d: 1, i: S.ym });
  else if (a == "delb") S.bills = S.bills.filter(function(b){ return b.id != i; });
  else if (a == "delx") S.ex = S.ex.filter(function(b){ return b.id != i; });
  save(); draw();
});

draw();
</script>
</body>
</html>
